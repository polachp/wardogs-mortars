<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WARDOGS Fire Control · Prototypy</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; background:#0b0f14; color:#e6edf3;
         font-family: ui-sans-serif, system-ui, sans-serif; display:flex; flex-direction:column; align-items:center; padding:60px 20px; gap:8px;}
  h1 { font-size:22px; margin:0; } p.sub { color:#7d8896; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; max-width:820px; width:100%; }
  a.card { text-decoration:none; color:inherit; background:#11171f; border:1px solid #232b36; border-radius:14px;
           padding:20px; transition:.15s; display:block; }
  a.card:hover { border-color:#3b82f6; transform:translateY(-2px); }
  .tag { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#7d8896; }
  .name { font-size:18px; font-weight:700; margin:6px 0; }
  .desc { font-size:13px; color:#9aa5b1; line-height:1.5; }
</style>
</head>
<body>
  <h1>WARDOGS Fire Control — prototypy interface</h1>
  <p class="sub">Klik do mapy • desktop • míň bordelu, rychlé zadání</p>
  <div class="grid">
    <a class="card" href="a-recon/">
      <div class="tag">Varianta A</div><div class="name">Recon</div>
      <div class="desc">Celoobrazovková mapa + plovoucí HUD. Maximálně čisté, azimut a MIL velké. Nula rozptýlení.</div>
    </a>
    <a class="card" href="b-sidebar/">
      <div class="tag">Varianta B</div><div class="name">Sidebar</div>
      <div class="desc">Mapa + panel s velkými odečty, ruční X/Y, swap. Klasika, plná kontrola.</div>
    </a>
  </div>
</body>
</html>
